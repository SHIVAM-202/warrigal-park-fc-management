name: Warrigal Park FC CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/**', 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    name: Unit & Integration Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Automated Test Suite (Domain Rules & DoD)
        run: npm test

      - name: Verify Seed Database Generation
        run: npm run seed

  docker-build:
    name: Container Build & Health Probe
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: warrigal-park-fc:latest

      - name: Test Container Run and Health Probe
        run: |
          docker run -d -p 3000:3000 --name test-app warrigal-park-fc:latest
          sleep 5
          docker exec test-app curl -f http://localhost:3000/api/health || exit 1
          docker stop test-app
